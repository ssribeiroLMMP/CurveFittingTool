[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "curvefit"
version = "0.1.0"
description = "Desktop scientific curve fitting with a Tkinter GUI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.2",
    "lmfit>=1.3",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "sympy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["curvefit*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
